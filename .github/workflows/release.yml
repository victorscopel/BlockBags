name: Release addon
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/validate.py ptBR
      - run: python tests/validate.py enUS
      - run: python tests/validate.py esES
      - run: python tests/validate.py frFR
      - run: python tools/package.py
      - name: Create release or upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) args+=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/BlockBags-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/BlockBags-*.zip --verify-tag --generate-notes "${args[@]}"
          fi
